<style>
/* Layout: one narrow column of controls (달력 → 항목 → 배치) above a live preview of the paper card, sticky action bar at the bottom. */
:root {
  --bg: #eef0f3;
  --surface: #ffffff;
  --ink: #1b2130;
  --muted: #5d6576;
  --line: #d9dde5;
  --accent: #3461b5;
  --accent-soft: #e3eafa;
  --fail: #c62828;
  --ui: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --card: "Jua", "IBM Plex Sans KR", "Malgun Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12151c; --surface: #1b2029; --ink: #e8ebf2; --muted: #9aa3b5; --line: #2d3442;
    --accent: #7ea2ec; --accent-soft: #23314d; --fail: #ff7a7a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12151c; --surface: #1b2029; --ink: #e8ebf2; --muted: #9aa3b5; --line: #2d3442;
  --accent: #7ea2ec; --accent-soft: #23314d; --fail: #ff7a7a; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--ui); font-size: 15px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 110px;
}
.wrap { max-width: 720px; margin: 0 auto; display: grid; gap: 14px; }
header h1 { font-size: 22px; margin: 0; letter-spacing: -0.01em; }
header p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 10px; min-width: 0; }
.panel h2 { font-size: 13px; font-weight: 600; color: var(--muted); margin: 0; letter-spacing: 0.04em; display: flex; justify-content: space-between; align-items: center; }
.panel h2 span { color: var(--accent); font-weight: 600; letter-spacing: 0; }

/* calendar */
.monthbar { display: flex; align-items: center; justify-content: space-between; }
.monthbar strong { font-size: 17px; }
.iconbtn { border: 1px solid var(--line); background: transparent; color: var(--ink); width: 34px; height: 34px; border-radius: 10px; font-size: 16px; cursor: pointer; }
.iconbtn:disabled { opacity: .35; cursor: default; }
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
.cal .dow { font-size: 12px; color: var(--muted); padding-bottom: 2px; }
.cal .dow:first-child { color: var(--fail); }
.cal .dow:last-child { color: var(--accent); }
.day {
  position: relative; aspect-ratio: 1 / 1; max-width: 100%; border-radius: 10px; border: 1px solid transparent;
  background: transparent; color: var(--ink); font: 500 15px var(--ui); cursor: pointer; font-variant-numeric: tabular-nums;
}
.day.has::after { content: ""; position: absolute; left: 50%; bottom: 6px; width: 5px; height: 5px; margin-left: -2.5px; border-radius: 50%; background: var(--accent); }
.day.today { border-color: var(--accent); }
.day.sel { background: var(--accent); color: #fff; }
.day.sel::after { background: #fff; }
.day.sel .ord { position: absolute; top: 2px; right: 4px; font-size: 10px; font-weight: 700; }
.day:disabled { color: var(--muted); opacity: .45; cursor: default; }
.quick { display: flex; gap: 6px; flex-wrap: wrap; }

.chip {
  border: 1px solid var(--line); background: transparent; color: var(--ink); border-radius: 999px;
  padding: 6px 12px; font: 500 14px var(--ui); cursor: pointer;
}
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.chip:disabled { opacity: .4; cursor: default; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* preview */
.stage { overflow: hidden; border-radius: 10px; background: repeating-conic-gradient(var(--line) 0 25%, transparent 0 50%) 0 0 / 16px 16px; }
.scaler { transform-origin: top left; width: max-content; }
.empty { color: var(--muted); text-align: center; padding: 28px 8px; font-size: 14px; }

/* sticky action bar */
.bar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
  padding: 12px max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  background: var(--surface); border-top: 1px solid var(--line);
}
.bar .in { max-width: 720px; margin: 0 auto; display: flex; gap: 10px; align-items: center; }
.bar .sum { flex: 1; min-width: 0; font-size: 13px; color: var(--muted); }
.primary { border: 0; background: var(--accent); color: #fff; font: 600 15px var(--ui); padding: 12px 18px; border-radius: 12px; cursor: pointer; }
.primary:disabled { opacity: .45; cursor: default; }

/* result overlay */
.overlay { position: fixed; inset: 0; z-index: 20; background: rgba(10,12,18,.82); overflow-y: auto;
  padding: calc(16px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.overlay .in { max-width: 560px; margin: 0 auto; display: grid; gap: 12px; color: #fff; }
.overlay .top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.overlay img { width: 100%; border-radius: 6px; display: block; -webkit-touch-callout: default; }
.overlay .hint { font-size: 13px; color: #c9cfdb; }
.ghost { border: 1px solid rgba(255,255,255,.4); background: transparent; color: #fff; font: 500 14px var(--ui); padding: 8px 14px; border-radius: 10px; cursor: pointer; }

/* ---------- paper card (fixed look, matches the 엑셀 sheet) ---------- */
.sheet { display: flex; gap: 0; font-family: var(--card); color: #222; }
.sheet.v { flex-direction: column; }
.paper {
  width: 600px; padding: 0;
  background-color: #f3ede3;
  background-image:
    radial-gradient(circle at 18% 22%, rgba(150,110,70,.07) 0 18%, transparent 40%),
    radial-gradient(circle at 82% 70%, rgba(150,110,70,.06) 0 15%, transparent 38%),
    linear-gradient(180deg, #f6f1e8, #efe7da);
  border: 1px dashed #b98d64;
}
.sheet.h .paper + .paper { border-left: 0; }
.sheet.v .paper + .paper { border-top: 0; }
.title { font-size: 28px; text-align: center; padding: 14px 8px 8px; color: #3a2a1c; border-bottom: 1px dashed #b98d64; }
.r { display: grid; grid-template-columns: 54px 1fr 112px 112px 88px; border-bottom: 1px dashed #c9a27e; min-height: 54px; }
.r:last-child { border-bottom: 0; }
.r > div { display: flex; align-items: center; justify-content: center; padding: 6px 8px; text-align: center; border-left: 1px dashed #c9a27e; font-size: 22px; line-height: 1.25; }
.r > div:first-child { border-left: 0; }
.r.wk { grid-template-columns: 1fr; }
.r.wk > div { font-size: 23px; }
.wk.sun > div { color: #c00000; } .wk.sat > div { color: #2f75b5; }
.r.hd > div { font-size: 21px; }
.st { color: #e00000; font-size: 19px !important; }
.nm.done { text-decoration: line-through; text-decoration-thickness: 1.5px; }
.r.one { background: rgba(120,90,60,.07); }
.act { color: #4472c4; }
.rate { position: relative; }
.rate .b { position: absolute; left: 0; top: 3px; bottom: 3px; background: #d9c3b0; }
.rate span { position: relative; }
.rate.ok span { color: #c00000; }
.r.total .act { color: #c00000; }
.r.g { grid-template-columns: 44px 1fr; min-height: 48px; }
.r.g > div:last-child { font-size: 19px; justify-content: center; padding: 6px 10px; text-wrap: pretty; }
.r.sec { grid-template-columns: 1fr; min-height: 40px; background: rgba(120,90,60,.10); }
.r.sec > div { font-size: 19px; color: #6b4f36; }
.r.n { grid-template-columns: 96px 1fr; }
.r.n > div:first-child { font-size: 18px; color: #6b4f36; }
.r.n > div:last-child { font-size: 19px; justify-content: flex-start; text-align: left; }

/* title + gratitude copy */
.fld { font-size: 13px; color: var(--muted); display: grid; gap: 2px; }
.fld small { font-size: 12px; opacity: .8; }
.panel input[type="text"], .panel textarea {
  width: 100%; min-width: 0; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink);
  font: 15px/1.55 var(--ui); padding: 10px 12px;
}
.panel input[type="text"]:focus-visible, .panel textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.copyrow { display: flex; gap: 8px; align-items: stretch; }
.copyrow input { flex: 1; font-weight: 600 !important; }
.cbtn { border: 1px solid var(--accent); background: var(--accent-soft); color: var(--accent); font: 600 14px var(--ui); padding: 0 14px; border-radius: 10px; cursor: pointer; white-space: nowrap; min-height: 40px; }
.cbtn.done { background: var(--accent); color: #fff; }
.glist { display: grid; gap: 14px; }
.gitem { display: grid; gap: 6px; }
.gitem .ghead { display: flex; justify-content: space-between; align-items: center; font-weight: 600; font-size: 14px; }
.gitem textarea { resize: vertical; min-height: 150px; }

#offscreen { position: fixed; left: -100000px; top: 0; }
@media (prefers-reduced-motion: no-preference) { .day, .chip { transition: background-color .12s, color .12s; } }
</style>

<div class="wrap">
  <header>
    <h1>목실감 캡처</h1>
    <p>목표&amp;실적은 엑셀 모양 이미지로, 감사일기는 월부 감사일기에 붙여넣을 텍스트로 만들어요. 지금은 11월 1~5일 엑셀 내용을 예시로 넣어뒀어요.</p>

      <button class="cbtn" id="copyTitle">복사</button>
    </div>
  </section>

  <section class="panel" aria-label="월부 감사일기">
    <h2>감사일기 텍스트 <span>월부 감사일기에 붙여넣기용</span></h2>
    <div id="gratList" class="glist"></div>
  </section>
</div>

<div class="bar"><div class="in">

</div>

function fmtRange(keys) {
  const ds = keys.map(parse).sort((a,b) => a-b), runs = [];
  ds.forEach(d => { const last = runs[runs.length-1]; if (last && (d - last[last.length-1]) === 86400000) last.push(d); else runs.push([d]); });
  return runs.map(r => {
    const a = r[0], b = r[r.length-1], A = `${a.getMonth()+1}.${a.getDate()}`;
    if (r.length === 1) return A;
    return a.getMonth() === b.getMonth() ? `${A}~${b.getDate()}` : `${A}~${b.getMonth()+1}.${b.getDate()}`;
  }).join(", ");
}
function buildTitle() {
  if (!state.selected.length) return "";

  return `${fmtRange(state.selected)} 목실감${s ? " " + s : ""}`;

async function copyFrom(el, btn) {
  const text = el.value;
  let ok = false;
  try { await navigator.clipboard.writeText(text); ok = true; } catch {}
  if (!ok) { el.focus(); el.select(); try { ok = document.execCommand("copy"); } catch {} }
  const old = btn.textContent;
  btn.textContent = ok ? "복사됨" : "길게 눌러 복사";
  btn.classList.toggle("done", ok);
  setTimeout(() => { btn.textContent = old; btn.classList.remove("done"); }, 1600);
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-copy]"); if (!b) return;
  copyFrom($(b.dataset.copy), b);
});

/* ---------- calendar ---------- */
function renderCal() {
  const { y, m } = state.month;
  $("monthLabel").textContent = `${y}년 ${m+1}월`;
  const first = new Date(y, m, 1).getDay();
  const days = new Date(y, m+1, 0).getDate();
  let html = DOW_KO.map(d => `<div class="dow">${d}</div>`).join("");
  for (let i = 0; i < first; i++) html += "<div></div>";
  for (let d = 1; d <= days; d++) {
    const k = iso(y,m,d);
    const has = !!byDate[k] && (byDate[k].tasks.length || byDate[k].gratitude.length);
    const idx = state.selected.indexOf(k);
    const cls = ["day", has && "has", idx >= 0 && "sel", k === TODAY && "today"].filter(Boolean).join(" ");
    html += `<button class="${cls}" data-k="${k}" ${has ? "" : "disabled"} aria-pressed="${idx>=0}" aria-label="${m+1}월 ${d}일">${d}${idx>=0 && state.selected.length>1 ? `<span class="ord">${idx+1}</span>` : ""}</button>`;
  }
  $("cal").innerHTML = html;
  $("prevM").disabled = true; $("nextM").disabled = true; // 예시는 11월만
  $("selCount").textContent = state.selected.length ? `${state.selected.length}일 선택` : "";
}
$("cal").addEventListener("click", e => {
  const b = e.target.closest(".day"); if (!b || b.disabled) return;
  const k = b.dataset.k, i = state.selected.indexOf(k);
  if (i >= 0) state.selected.splice(i, 1); else state.selected.push(k);
  state.selected.sort();
  update();
});
function pickDays(list) { state.selected = list.filter(k => byDate[k]).sort(); update(); }
$("qToday").onclick = () => pickDays([TODAY]);

      <div>${hrs(t.goal)}</div>
      <div class="act">${hrs(t.actual)}</div>
      <div class="rate${r != null && r >= 1 ? " ok" : ""}">${bar}<span>${r == null ? "" : Math.round(r*100) + "%"}</span></div>
    </div>`;
  };
  let h = `<div class="paper">`;
  if (state.title) h += `<div class="title">${dt.getMonth()+1}월 ${dt.getDate()}일 (${DOW_KO[dow]}) 목실감</div>`;
  h += `<div class="r wk${dow===0?" sun":dow===6?" sat":""}"><div>${DOW_EN[dow]}</div></div>`;
  const showTasks = S.has("one") || S.has("tasks") || S.has("total");
  if (showTasks) h += `<div class="r hd"><div></div><div>${dt.getDate()}</div><div>목표</div><div>실제</div><div>달성률</div></div>`;
  d.tasks.forEach(t => { if ((t.one && S.has("one")) || (!t.one && S.has("tasks"))) h += row(t); });
  if (S.has("total") && d.sum) {
    const r = pct(d.sum.actual, d.sum.goal);
    h += `<div class="r total"><div></div><div>합계</div><div>${hrs(d.sum.goal)}</div><div class="act">${hrs(d.sum.actual)}</div>
      <div class="rate">${r==null?"":`<i class="b" style="width:${Math.min(r,1)*100}%"></i>`}<span>${r==null?"":Math.round(r*100)+"%"}</span></div></div>`;
  }
  if (S.has("notes") && d.notes.length) d.notes.forEach(n => { h += `<div class="r n"><div>${esc(n.k)}</div><div>${esc(n.v)}</div></div>`; });
  if (S.has("grat") && d.gratitude.length) {
    h += `<div class="r sec"><div>감사일기</div></div>`;
    d.gratitude.forEach((g,i) => { h += `<div class="r g"><div>${i+1}</div><div>${esc(g)}</div></div>`; });
  }
  return h + `</div>`;
}
function sheetHTML(keys, layout) {
  return `<div class="sheet ${layout === "h" ? "h" : "v"}">${keys.map(cardHTML).join("")}</div>`;
}

/* ---------- preview ---------- */
function renderPreview() {
  const sc = $("scaler");
  if (!state.selected.length) { sc.style.transform = ""; $("stage").style.height = ""; sc.innerHTML = `<div class="empty">달력에서 날짜를 눌러 골라주세요.</div>`; sc.style.width = "100%"; return; }
  sc.style.width = "";
  const keys = state.selected;
  sc.innerHTML = state.layout === "each"
    ? `<div style="display:grid;gap:16px">${keys.map(k => sheetHTML([k], "v")).join("")}</div>`
    : sheetHTML(keys, state.layout);
  fit();
}
function fit() {
  const sc = $("scaler"), stage = $("stage");
  if (!state.selected.length) return;
  sc.style.transform = "none";
  const w = sc.scrollWidth, h = sc.scrollHeight, avail = stage.clientWidth;
  const s = Math.min(1, avail / w);
  sc.style.transform = `scale(${s})`;
  stage.style.height = Math.ceil(h * s) + "px";
}
addEventListener("resize", fit);

function renderBar() {
  const n = state.selected.length;
  const imgs = n === 0 ? 0 : state.layout === "each" ? n : 1;
  $("barSum").textContent = n ? `${state.selected.map(k => { const d = parse(k); return `${d.getMonth()+1}/${d.getDate()}`; }).join(", ")} · 이미지 ${imgs}장` : "날짜를 골라주세요";
  $("make").disabled = !n || state.secs.size === 0;
}

function update() { renderCal(); renderChips(); renderPreview(); renderBar(); renderTitle(); renderGrat(); }

$("suffix").value = loadSuffix();
$("suffix").addEventListener("input", () => { saveSuffix($("suffix").value); renderTitle(); });
$("copyTitle").onclick = () => { if (state.selected.length) copyFrom($("titleOut"), $("copyTitle")); };

/* ---------- capture ---------- */
$("make").onclick = async () => {
  const btn = $("make"); btn.disabled = true; btn.textContent = "만드는 중…";
  try {
    if (document.fonts && document.fonts.ready) await document.fonts.ready;
    const groups = state.layout === "each" ? state.selected.map(k => [k]) : [state.selected];
    const off = $("offscreen"), out = [];
    for (const g of groups) {
      off.innerHTML = sheetHTML(g, state.layout === "each" ? "v" : state.layout);
      const canvas = await html2canvas(off.firstElementChild, { scale: 3, backgroundColor: "#f3ede3", logging: false });
      out.push({ url: canvas.toDataURL("image/png"), label: g.map(k => { const d = parse(k); return `${d.getMonth()+1}/${d.getDate()}`; }).join(", ") });
    }
    off.innerHTML = "";
    $("ovTitle").textContent = `이미지 ${out.length}장`;
    $("ovImgs").innerHTML = out.map(o => `<figure style="margin:0;display:grid;gap:6px"><img src="${o.url}" alt="${esc(o.label)} 목실감"><figcaption class="hint">${esc(o.label)}</figcaption></figure>`).join("");
    $("overlay").hidden = false;
  } catch (err) {
    $("barSum").textContent = "이미지를 만들지 못했어요. 페이지를 새로고침한 뒤 다시 눌러주세요.";
  } finally { btn.textContent = "이미지 만들기"; renderBar(); }
};
$("ovClose").onclick = () => { $("overlay").hidden = true; $("ovImgs").innerHTML = ""; };

update();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
</script>
